<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      const basePath = '/legacy-manager'
      const requestedPath = window.location.pathname.startsWith(basePath)
        ? window.location.pathname.slice(basePath.length)
        : window.location.pathname
      sessionStorage.setItem('legacy-manager:route', requestedPath + window.location.search + window.location.hash)
      window.location.replace(`${basePath}/`)
    </script>
  </head>
  <body></body>
</html>
