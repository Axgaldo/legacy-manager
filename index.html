<html lang="es">

    <script>
      const pendingPath = sessionStorage.getItem('legacy-manager:route')

        sessionStorage.removeItem('legacy-manager:route')
        history.replaceState(null, '', `/legacy-manager${pendingPath}`)
      }
    </script>
